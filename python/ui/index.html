<title>METACOD GLP-1 — Complication Prevention</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ============================================================
   Design tokens — editorial clinical
   ============================================================ */
:root {
  --cream: #FAF8F4;
  --cream-deep: #F1ECE0;
  --paper-edge: #E5DFD3;
  --ink: #1A1815;
  --ink-soft: #4A4540;
  --ink-quiet: #807A72;
  --petrol: #1F4A4D;
  --petrol-soft: #5D8385;
  --triage-green: #2D6E4F;
  --triage-green-bg: #E8F0E9;
  --triage-yellow: #946A12;
  --triage-yellow-bg: #FAF1D9;
  --triage-red: #A8281B;
  --triage-red-bg: #FBE7E2;
  --grade-a: #2D6E4F;
  --grade-b: #946A12;
  --grade-c: #807A72;
  --admin-ink: #4A2E8A;
  --admin-bg: #F4F0FF;
  --admin-edge: #B59FE0;
  --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --sans: "Geist", "Helvetica Neue", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", monospace;
  --radius: 4px;
  --shadow-paper: 0 1px 0 rgba(26, 24, 21, 0.04), 0 4px 14px -8px rgba(26, 24, 21, 0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--cream);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  font-feature-settings: "ss01", "ss02", "cv11";
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

html[dir="rtl"] body { font-family: var(--sans); }

#root { min-height: 100vh; }

.app {
  max-width: 980px;
  margin: 0 auto;
  padding: 48px 40px 80px;
}
@media (max-width: 720px) { .app { padding: 28px 20px 60px; } }

/* ============================================================
   Header
   ============================================================ */
.header {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 24px;
  align-items: end;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--paper-edge);
  margin-bottom: 40px;
}
.brand-title {
  font-family: var(--serif);
  font-size: 56px;
  font-style: italic;
  font-weight: 400;
  letter-spacing: -0.02em;
  line-height: 0.95;
  color: var(--ink);
}
.brand-sub {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: var(--ink-quiet);
  margin-top: 6px;
}
@media (max-width: 720px) { .brand-title { font-size: 40px; } }

.header-controls { display: flex; flex-direction: column; gap: 12px; align-items: flex-end; }
html[dir="rtl"] .header-controls { align-items: flex-start; }
.control-row { display: flex; gap: 8px; align-items: center; font-size: 12px; }
.control-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-quiet);
  margin-inline-end: 8px;
}

.tab-group { display: inline-flex; border: 1px solid var(--paper-edge); border-radius: var(--radius); background: var(--cream); }
.tab {
  padding: 6px 12px;
  font-size: 12px;
  font-family: var(--mono);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  background: transparent;
  border: 0;
  color: var(--ink-quiet);
  cursor: pointer;
  border-inline-end: 1px solid var(--paper-edge);
  transition: background 120ms, color 120ms;
}
.tab:last-child { border-inline-end: 0; }
.tab:hover { color: var(--ink); }
.tab.active { background: var(--ink); color: var(--cream); }

/* ============================================================
   Section labels (editorial)
   ============================================================ */
.section { margin-top: 48px; }
.section-label {
  display: flex; align-items: baseline; gap: 12px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--ink-quiet);
  margin-bottom: 16px;
}
.section-label::after {
  content: "";
  flex: 1;
  border-bottom: 1px dotted var(--paper-edge);
  transform: translateY(-3px);
}

.section-title {
  font-family: var(--serif);
  font-size: 32px;
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 1.05;
  margin-bottom: 8px;
}

.lede {
  font-family: var(--serif);
  font-size: 19px;
  font-style: italic;
  color: var(--ink-soft);
  line-height: 1.5;
  max-width: 60ch;
  margin-bottom: 8px;
}

/* ============================================================
   Patient form
   ============================================================ */
.form-grid { display: grid; gap: 28px; }
.fieldset {
  border: 1px solid var(--paper-edge);
  background: var(--cream);
  border-radius: var(--radius);
  padding: 20px 24px;
}
.fieldset-title {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 400;
  margin-bottom: 16px;
  color: var(--ink);
  letter-spacing: -0.005em;
}
.field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 20px; }

.field { display: flex; flex-direction: column; gap: 4px; }
.field-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-quiet);
  font-weight: 500;
}
.field-hint { font-size: 11px; color: var(--ink-quiet); font-style: italic; margin-top: 2px; }
.input, .select, .textarea {
  font-family: var(--sans);
  font-size: 14px;
  padding: 7px 10px;
  background: var(--cream);
  border: 1px solid var(--paper-edge);
  border-radius: var(--radius);
  color: var(--ink);
  font-weight: 400;
  transition: border-color 120ms;
}
.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--petrol);
  box-shadow: 0 0 0 3px rgba(31, 74, 77, 0.08);
}
.checkbox-row { display: flex; gap: 8px; align-items: center; padding: 6px 0; }
.checkbox-row input[type="checkbox"] { accent-color: var(--petrol); width: 16px; height: 16px; }
.checkbox-row label { font-size: 13px; cursor: pointer; user-select: none; }

.meds-list { margin-top: 8px; display: flex; flex-direction: column; gap: 10px; }
.med-row {
  display: grid;
  grid-template-columns: 2fr 2fr 0.8fr auto;
  gap: 8px;
  align-items: center;
}
.med-remove {
  background: transparent;
  border: 1px solid var(--paper-edge);
  color: var(--ink-quiet);
  width: 28px; height: 28px;
  border-radius: var(--radius);
  cursor: pointer;
  font-family: var(--mono);
  transition: all 120ms;
}
.med-remove:hover { color: var(--triage-red); border-color: var(--triage-red); }
.med-add {
  background: transparent;
  border: 1px dashed var(--paper-edge);
  color: var(--petrol);
  font-size: 12px;
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 8px 12px;
  border-radius: var(--radius);
  cursor: pointer;
  margin-top: 8px;
  width: 100%;
  transition: all 120ms;
}
.med-add:hover { border-color: var(--petrol); background: rgba(31, 74, 77, 0.04); }

/* ============================================================
   Action button (primary)
   ============================================================ */
.cta-row { display: flex; gap: 16px; align-items: center; margin-top: 32px; }
.btn-primary {
  background: var(--ink);
  color: var(--cream);
  border: 0;
  padding: 14px 28px;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background 140ms;
}
.btn-primary:hover { background: var(--petrol); }
.btn-primary:disabled { background: var(--ink-quiet); cursor: not-allowed; }
.btn-secondary {
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--paper-edge);
  padding: 12px 22px;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 120ms;
}
.btn-secondary:hover { border-color: var(--ink); }

/* ============================================================
   Triage banner
   ============================================================ */
.triage {
  display: flex; align-items: baseline; gap: 20px;
  padding: 28px 32px;
  border-radius: var(--radius);
  margin-bottom: 8px;
}
.triage-color {
  font-family: var(--serif);
  font-size: 44px;
  font-style: italic;
  font-weight: 400;
  line-height: 0.9;
}
.triage-text { font-size: 15px; line-height: 1.45; max-width: 60ch; }
.triage-green { background: var(--triage-green-bg); color: var(--triage-green); border-left: 4px solid var(--triage-green); }
.triage-yellow { background: var(--triage-yellow-bg); color: var(--triage-yellow); border-left: 4px solid var(--triage-yellow); }
.triage-red { background: var(--triage-red-bg); color: var(--triage-red); border-left: 4px solid var(--triage-red); }
html[dir="rtl"] .triage { border-left: 0; border-right: 4px solid; }
html[dir="rtl"] .triage-green { border-right-color: var(--triage-green); }
html[dir="rtl"] .triage-yellow { border-right-color: var(--triage-yellow); }
html[dir="rtl"] .triage-red { border-right-color: var(--triage-red); }

/* ============================================================
   Interaction cards
   ============================================================ */
.interactions { display: flex; flex-direction: column; gap: 16px; }
.rule-card {
  background: var(--cream);
  border: 1px solid var(--paper-edge);
  border-left: 3px solid var(--paper-edge);
  border-radius: var(--radius);
  padding: 18px 22px;
  box-shadow: var(--shadow-paper);
}
html[dir="rtl"] .rule-card { border-left: 1px solid var(--paper-edge); border-right: 3px solid var(--paper-edge); }
.rule-card.severity-high { border-left-color: var(--triage-red); }
.rule-card.severity-moderate { border-left-color: var(--triage-yellow); }
.rule-card.severity-low { border-left-color: var(--triage-green); }
html[dir="rtl"] .rule-card.severity-high { border-right-color: var(--triage-red); border-left-color: var(--paper-edge); }
html[dir="rtl"] .rule-card.severity-moderate { border-right-color: var(--triage-yellow); border-left-color: var(--paper-edge); }
html[dir="rtl"] .rule-card.severity-low { border-right-color: var(--triage-green); border-left-color: var(--paper-edge); }

.rule-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 4px; }
.rule-name {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 400;
  color: var(--ink);
  line-height: 1.2;
}
.rule-med { font-size: 12px; color: var(--ink-quiet); margin-top: 2px; font-family: var(--mono); letter-spacing: 0.04em; }
.grade-badge {
  display: inline-flex;
  align-items: center;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.1em;
  padding: 3px 8px;
  border-radius: 999px;
  white-space: nowrap;
}
.grade-A { background: var(--grade-a); color: var(--cream); }
.grade-B { background: var(--grade-b); color: var(--cream); }
.grade-C { background: var(--grade-c); color: var(--cream); }

.sub-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-quiet);
  margin: 14px 0 6px;
  font-weight: 500;
}
.action-list { list-style: none; padding: 0; }
.action-list li {
  padding: 4px 0 4px 18px;
  font-size: 14px;
  line-height: 1.5;
  position: relative;
}
html[dir="rtl"] .action-list li { padding: 4px 18px 4px 0; }
.action-list li::before {
  content: "—";
  position: absolute;
  left: 0;
  color: var(--ink-quiet);
}
html[dir="rtl"] .action-list li::before { left: auto; right: 0; }
.action-list li .grade-badge { transform: translateY(-1px); margin-inline-start: 8px; }

.admin-block {
  margin-top: 14px;
  padding: 12px 14px;
  background: var(--admin-bg);
  border: 1px dashed var(--admin-edge);
  border-radius: var(--radius);
  font-family: var(--mono);
  font-size: 11px;
  color: var(--admin-ink);
  line-height: 1.55;
}
.admin-label {
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 10px;
  margin-inline-end: 8px;
}
.admin-mech {
  font-family: var(--serif);
  font-style: italic;
  font-size: 13px;
  color: var(--admin-ink);
  margin-top: 6px;
  line-height: 1.45;
}
.admin-sources { margin-top: 6px; font-size: 10px; opacity: 0.8; }

/* ============================================================
   Forecast
   ============================================================ */
.forecast-grid { display: grid; gap: 18px; }
.decision-card {
  background: var(--cream);
  border: 1px solid var(--paper-edge);
  border-radius: var(--radius);
  padding: 22px 26px;
}
.decision-value {
  font-family: var(--serif);
  font-size: 36px;
  font-weight: 400;
  letter-spacing: -0.01em;
  margin-bottom: 2px;
  line-height: 1;
}
.decision-value.HOLD { color: var(--triage-red); }
.decision-value.REVIEW { color: var(--triage-yellow); }
.decision-value.CONTINUE { color: var(--triage-green); }
.decision-desc { font-size: 14px; color: var(--ink-soft); margin-top: 8px; line-height: 1.5; }
.rationale { margin-top: 8px; font-style: italic; color: var(--ink-quiet); font-size: 13px; }
.rationale ul { list-style: none; padding: 0; }
.rationale li { padding: 2px 0; }

.risk-row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 16px;
  padding: 12px 0;
  border-bottom: 1px dotted var(--paper-edge);
  align-items: baseline;
}
.risk-row:last-child { border-bottom: 0; }
.risk-tf {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--petrol);
  white-space: nowrap;
  font-weight: 500;
}
.risk-text { font-size: 14px; line-height: 1.4; }

/* ============================================================
   Sign-off panel
   ============================================================ */
.signoff-panel {
  background: linear-gradient(180deg, var(--cream) 0%, var(--cream-deep) 100%);
  border: 1px solid var(--paper-edge);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-top: 8px;
}
.signoff-title { font-family: var(--serif); font-size: 24px; font-weight: 400; margin-bottom: 4px; }
.signoff-sub { font-size: 12px; color: var(--ink-quiet); margin-bottom: 16px; font-style: italic; }
.signoff-status {
  display: inline-flex;
  align-items: center;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 999px;
  margin-inline-start: 8px;
}
.signoff-status.pending { background: var(--triage-yellow-bg); color: var(--triage-yellow); }
.signoff-status.signed { background: var(--triage-green-bg); color: var(--triage-green); }
.signoff-status.rejected { background: var(--triage-red-bg); color: var(--triage-red); }

/* ============================================================
   Misc
   ============================================================ */
.spinner {
  width: 16px; height: 16px;
  border: 2px solid var(--paper-edge);
  border-top-color: var(--ink);
  border-radius: 50%;
  animation: spin 600ms linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--cream);
  padding: 12px 20px;
  border-radius: var(--radius);
  font-size: 13px;
  z-index: 100;
  font-family: var(--mono);
  letter-spacing: 0.04em;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}

.mode-badge {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding: 2px 6px;
  border-radius: 2px;
  background: var(--paper-edge);
  color: var(--ink-quiet);
}
.mode-badge.live { background: var(--triage-green-bg); color: var(--triage-green); }

footer {
  margin-top: 64px;
  padding-top: 20px;
  border-top: 1px solid var(--paper-edge);
  font-size: 11px;
  color: var(--ink-quiet);
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
footer span { font-family: var(--mono); letter-spacing: 0.04em; }

[hidden] { display: none !important; }
</style>
</head>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useMemo, useCallback } = React;

// ----- Config -----
const UI_I18N = JSON.parse(document.getElementById('ui-i18n').textContent);

// ----- Utilities -----
function t(locale, key, params = {}) {
  let val = (UI_I18N[locale] && UI_I18N[locale][key]) || UI_I18N.ru[key] || key;
  Object.entries(params).forEach(([k, v]) => { val = val.replace(`{${k}}`, v); });
  return val;
}

function directionFor(locale) {
  return locale === 'he' ? 'rtl' : 'ltr';
}

function emptyPatient() {

    ]
  };
}

// ============================================================
// API
// ============================================================
async function callAssess(patient, locale) {
  if (!IS_LIVE) {
    await new Promise(r => setTimeout(r, 500));
    return MOCK_ASSESSMENT;
  }
  const resp = await fetch(`${API_BASE}/glp1/assess`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ locale, patient })
  });
  if (!resp.ok) throw new Error("Assess failed: " + resp.status);
  return resp.json();
}

async function callSignOff(visit_id, payload) {
  if (!IS_LIVE) {
    await new Promise(r => setTimeout(r, 350));
    return { sign_off_id: 1, visit_id, status: payload.status, signed_at: new Date().toISOString() };
  }
  const resp = await fetch(`${API_BASE}/glp1/sign-off`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ visit_id, ...payload })
  });
  if (!resp.ok) throw new Error("Sign-off failed: " + resp.status);
  return resp.json();
}

// ============================================================
// Patient form
// ============================================================
function PatientForm({ locale, patient, setPatient, onSubmit, submitting }) {
  const upd = (path, value) => {
    setPatient(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      const parts = path.split('.');
      let obj = next;
      for (let i = 0; i < parts.length - 1; i++) obj = obj[parts[i]];
      obj[parts[parts.length - 1]] = value;
      return next;
    });
  };
  const numOrNull = (v) => v === "" || v === null ? null : Number(v);

  return (
    <div>
      <div className="section">
        <div className="section-label">{t(locale, 'section_input')}</div>
        <div className="section-title">{t(locale, 'section_input')}</div>
        <div className="lede">{t(locale, 'section_input_lede')}</div>
      </div>

      <div className="form-grid" style={{ marginTop: 32 }}>
        {/* Demographics + GLP-1 */}
        <div className="fieldset">
          <div className="fieldset-title">{t(locale, 'fs_demographics')} · {t(locale, 'fs_glp1')}</div>
          <div className="field-grid">
            <Field label={t(locale, 'f_patient_id')}><input className="input" value={patient.patient_id} onChange={e => upd('patient_id', e.target.value)} /></Field>
            <Field label={t(locale, 'f_age')}><input type="number" className="input" value={patient.age_years} onChange={e => upd('age_years', Number(e.target.value))} /></Field>
            <Field label={t(locale, 'f_sex')}>
              <select className="select" value={patient.sex} onChange={e => upd('sex', e.target.value)}>
                <option value="female">female</option>
                <option value="male">male</option>
                <option value="other">other</option>
              </select>
            </Field>
            <Field label={t(locale, 'f_weight')}><input type="number" className="input" value={patient.weight_kg ?? ''} onChange={e => upd('weight_kg', numOrNull(e.target.value))} /></Field>
            <Field label={t(locale, 'f_glp1_agent')}>
              <select className="select" value={patient.glp1_agent} onChange={e => upd('glp1_agent', e.target.value)}>
                {GLP1_AGENTS.map(a => <option key={a} value={a}>{a}</option>)}
              </select>
            </Field>
            <Field label={t(locale, 'f_glp1_weeks_start')}><input type="number" className="input" value={patient.glp1_weeks_since_start ?? ''} onChange={e => upd('glp1_weeks_since_start', numOrNull(e.target.value))} /></Field>
            <Field label={t(locale, 'f_glp1_weeks_esc')}><input type="number" className="input" value={patient.glp1_weeks_since_last_dose_increase ?? ''} onChange={e => upd('glp1_weeks_since_last_dose_increase', numOrNull(e.target.value))} /></Field>
          </div>
        </div>

        {/* Concomitant + organ + inflammation */}
        <div className="fieldset">
          <div className="fieldset-title">{t(locale, 'fs_concomitant')} · {t(locale, 'fs_organ')}</div>
          <div className="field-grid">
            <Checkbox label={t(locale, 'f_ppi')} checked={patient.ppi_or_h2_blocker} onChange={v => upd('ppi_or_h2_blocker', v)} />
            <Checkbox label={t(locale, 'f_cation')} checked={patient.calcium_iron_magnesium_aluminum_products} onChange={v => upd('calcium_iron_magnesium_aluminum_products', v)} />
            <Checkbox label={t(locale, 'f_bas')} checked={patient.bile_acid_sequestrants} onChange={v => upd('bile_acid_sequestrants', v)} />
            <Checkbox label={t(locale, 'f_sucralfate')} checked={patient.sucralfate} onChange={v => upd('sucralfate', v)} />
            <Field label={t(locale, 'f_child_pugh')}>
              <select className="select" value={patient.child_pugh} onChange={e => upd('child_pugh', e.target.value)}>
                <option value="none">none</option><option value="A">A</option><option value="B">B</option><option value="C">C</option>
              </select>
            </Field>
            <Checkbox label={t(locale, 'f_aki')} checked={patient.aki_present} onChange={v => upd('aki_present', v)} />
            <Checkbox label={t(locale, 'f_hf')} checked={patient.heart_failure_congestion} onChange={v => upd('heart_failure_congestion', v)} />
            <Checkbox label={t(locale, 'f_gut_edema')} checked={patient.gut_edema_suspected} onChange={v => upd('gut_edema_suspected', v)} />
            <Field label={t(locale, 'f_inflam')}>
              <select className="select" value={patient.systemic_inflammation} onChange={e => upd('systemic_inflammation', e.target.value)}>
                <option value="none">none</option><option value="mild">mild</option><option value="moderate">moderate</option><option value="severe">severe</option>
              </select>
            </Field>
            <Checkbox label={t(locale, 'f_acute_inf')} checked={patient.acute_infection} onChange={v => upd('acute_infection', v)} />
            <Field label={t(locale, 'f_bariatric')}>
              <select className="select" value={patient.bariatric_type} onChange={e => upd('bariatric_type', e.target.value)}>
                <option value="none">none</option><option value="RYGB">RYGB</option><option value="sleeve">sleeve</option><option value="duodenal_switch">duodenal switch</option>
              </select>
            </Field>
            <Field label={t(locale, 'f_months_bar')}><input type="number" className="input" value={patient.months_since_bariatric ?? ''} onChange={e => upd('months_since_bariatric', numOrNull(e.target.value))} /></Field>
          </div>
        </div>

        {/* Symptoms */}
        <div className="fieldset">
          <div className="fieldset-title">{t(locale, 'fs_symptoms')}</div>
          <div className="field-grid">
            <Field label={t(locale, 'f_nausea')}><input type="number" min="0" max="10" className="input" value={patient.symptoms.nausea_score} onChange={e => upd('symptoms.nausea_score', Number(e.target.value))} /></Field>
            <Field label={t(locale, 'f_vomit')}><input type="number" min="0" className="input" value={patient.symptoms.vomiting_episodes_24h} onChange={e => upd('symptoms.vomiting_episodes_24h', Number(e.target.value))} /></Field>
            <Field label={t(locale, 'f_pain')}><input type="number" min="0" max="10" className="input" value={patient.symptoms.abdominal_pain_score} onChange={e => upd('symptoms.abdominal_pain_score', Number(e.target.value))} /></Field>
            <Field label={t(locale, 'f_constipation')}><input type="number" min="0" className="input" value={patient.symptoms.constipation_days_without_stool} onChange={e => upd('symptoms.constipation_days_without_stool', Number(e.target.value))} /></Field>
            <Field label={t(locale, 'f_diarrhea')}><input type="number" min="0" className="input" value={patient.symptoms.diarrhea_episodes_24h} onChange={e => upd('symptoms.diarrhea_episodes_24h', Number(e.target.value))} /></Field>
            <Checkbox label={t(locale, 'f_early_satiety')} checked={patient.symptoms.early_satiety} onChange={v => upd('symptoms.early_satiety', v)} />
            <Checkbox label={t(locale, 'f_unable_fluids')} checked={patient.symptoms.unable_to_keep_fluids} onChange={v => upd('symptoms.unable_to_keep_fluids', v)} />
            <Checkbox label={t(locale, 'f_unable_meds')} checked={patient.symptoms.unable_to_keep_meds} onChange={v => upd('symptoms.unable_to_keep_meds', v)} />
            <Checkbox label={t(locale, 'f_dizziness')} checked={patient.symptoms.dizziness_or_orthostasis} onChange={v => upd('symptoms.dizziness_or_orthostasis', v)} />
            <Checkbox label={t(locale, 'f_reduced_urine')} checked={patient.symptoms.reduced_urine_output} onChange={v => upd('symptoms.reduced_urine_output', v)} />
            <Checkbox label={t(locale, 'f_black_stool')} checked={patient.symptoms.black_stool_or_visible_blood} onChange={v => upd('symptoms.black_stool_or_visible_blood', v)} />
            <Checkbox label={t(locale, 'f_fever')} checked={patient.symptoms.fever} onChange={v => upd('symptoms.fever', v)} />
            <Checkbox label={t(locale, 'f_weaker_meds')} checked={patient.symptoms.weaker_effect_of_regular_meds} onChange={v => upd('symptoms.weaker_effect_of_regular_meds', v)} />
          </div>
        </div>

        {/* Labs */}
        <div className="fieldset">
          <div className="fieldset-title">{t(locale, 'fs_labs')}</div>
          <div className="field-grid">
            <Field label={t(locale, 'f_egfr')}><input type="number" step="any" className="input" value={patient.labs.egfr_ml_min ?? ''} onChange={e => upd('labs.egfr_ml_min', numOrNull(e.target.value))} /></Field>
            <Field label={t(locale, 'f_crp')}><input type="number" step="any" className="input" value={patient.labs.crp_mg_l ?? ''} onChange={e => upd('labs.crp_mg_l', numOrNull(e.target.value))} /></Field>
            <Field label={t(locale, 'f_tsh')}><input type="number" step="any" className="input" value={patient.labs.tsh_miu_l ?? ''} onChange={e => upd('labs.tsh_miu_l', numOrNull(e.target.value))} /></Field>
            <Field label={t(locale, 'f_albumin')}><input type="number" step="any" className="input" value={patient.labs.albumin_g_dl ?? ''} onChange={e => upd('labs.albumin_g_dl', numOrNull(e.target.value))} /></Field>
            <Field label={t(locale, 'f_ferritin')}><input type="number" step="any" className="input" value={patient.labs.ferritin_ng_ml ?? ''} onChange={e => upd('labs.ferritin_ng_ml', numOrNull(e.target.value))} /></Field>
            <Field label={t(locale, 'f_inr')}><input type="number" step="any" className="input" value={patient.labs.inr ?? ''} onChange={e => upd('labs.inr', numOrNull(e.target.value))} /></Field>
          </div>
        </div>

        {/* Medications */}
        <div className="fieldset">
          <div className="fieldset-title">{t(locale, 'fs_meds')}</div>
          <div className="meds-list">
            {patient.medications.map((m, idx) => (
              <div className="med-row" key={idx}>
                <input className="input" placeholder={t(locale, 'f_med_name')} value={m.name} onChange={e => {
                  const next = [...patient.medications];
                  next[idx] = { ...next[idx], name: e.target.value };
                  upd('medications', next);
                }} />
                <select className="select" value={m.profile_id} onChange={e => {
                  const next = [...patient.medications];
                  next[idx] = { ...next[idx], profile_id: e.target.value };
                  upd('medications', next);
                }}>
                  <option value="">— {t(locale, 'f_med_profile')} —</option>
                  {DRUG_PROFILES.map(p => <option key={p} value={p}>{p}</option>)}
                </select>
                <label className="checkbox-row">
                  <input type="checkbox" checked={m.is_essential} onChange={e => {
                    const next = [...patient.medications];
                    next[idx] = { ...next[idx], is_essential: e.target.checked };
                    upd('medications', next);
                  }} />
                  <span style={{ fontSize: 11, textTransform: 'uppercase', letterSpacing: '0.08em', color: 'var(--ink-quiet)' }}>{t(locale, 'f_med_essential')}</span>
                </label>
                <button className="med-remove" onClick={() => {
                  upd('medications', patient.medications.filter((_, i) => i !== idx));
                }} aria-label="remove">×</button>
              </div>
            ))}
          </div>
          <button className="med-add" onClick={() => {
            upd('medications', [...patient.medications, { name: '', profile_id: '', route: 'oral', is_essential: false }]);
          }}>+ {t(locale, 'fs_meds')}</button>
        </div>
      </div>

      <div className="cta-row">
        <button className="btn-primary" onClick={onSubmit} disabled={submitting}>
          {submitting ? <><span className="spinner"></span> &nbsp; {t(locale, 'submitting')}</> : t(locale, 'btn_assess')}
        </button>
      </div>
    </div>
  );
}

function Field({ label, children }) {
  return <div className="field"><span className="field-label">{label}</span>{children}</div>;
}
function Checkbox({ label, checked, onChange }) {
  return (
    <label className="checkbox-row">
      <input type="checkbox" checked={!!checked} onChange={e => onChange(e.target.checked)} />
      <span>{label}</span>
    </label>
  );
}

// ============================================================
// Assessment result
// ============================================================
function AssessmentResult({ locale, layer, result, onSignOff, onNewVisit, signing }) {
  const a = result.assessment;
  const triageClass = `triage triage-${a.triage_color}`;

  return (
    <div>
      <div className="section">
        <div className="section-label">{t(locale, 'section_triage')}</div>
        <div className={triageClass}>
          <div className="triage-color">{a.triage_color.toUpperCase()}</div>
          <div className="triage-text">{a.triage_summary_i18n_text}</div>
        </div>
      </div>

      <div className="section">
        <div className="section-label">{t(locale, 'section_interactions')}</div>
        {a.interactions.length === 0 ? (
          <div style={{ color: 'var(--ink-quiet)', fontStyle: 'italic' }}>{t(locale, 'no_rules_fired')}</div>
        ) : (
          <div className="interactions">
            {a.interactions.map((f, i) => (
              <RuleCard key={i} finding={f} locale={locale} layer={layer} />
            ))}
          </div>
        )}
      </div>

      <div className="section">
        <div className="section-label">{t(locale, 'section_forecast')}</div>
        <ForecastSection forecast={a.forecast} locale={locale} layer={layer} />
      </div>

      <div className="section">
        <div className="section-label">{t(locale, 'section_signoff')}</div>
        <SignOffPanel
          locale={locale}
          status={result.sign_off_status}
          onSign={onSignOff}
          signing={signing}
          onNewVisit={onNewVisit}
        />
      </div>
    </div>
  );
}

function RuleCard({ finding, locale, layer }) {
  return (
    <div className={`rule-card severity-${finding.severity}`}>
      <div className="rule-head">
        <div>
          <div className="rule-name">{finding.rule_name}</div>
          <div className="rule-med">{finding.medication_name}</div>
        </div>
        <span className={`grade-badge grade-${finding.evidence_grade}`}>{finding.evidence_grade}</span>
      </div>

      {finding.physician_actions?.length > 0 && (
        <>
          <div className="sub-label">{t(locale, 'subsection_phys_actions')}</div>
          <ul className="action-list">
            {finding.physician_actions.map((a, i) => (
              <li key={i}>{a.i18n_text}<span className={`grade-badge grade-${a.evidence_grade}`}>{a.evidence_grade}</span></li>
            ))}
          </ul>
        </>
      )}

      {finding.patient_actions?.length > 0 && (
        <>
          <div className="sub-label">{t(locale, 'subsection_pat_actions')}</div>
          <ul className="action-list">
            {finding.patient_actions.map((a, i) => <li key={i}>{a.i18n_text}</li>)}
          </ul>
        </>
      )}

      {finding.lab_plan?.length > 0 && (
        <>
          <div className="sub-label">{t(locale, 'subsection_lab_plan')}</div>
          <ul className="action-list">
            {finding.lab_plan.map((l, i) => <li key={i}>{l.i18n_text}</li>)}
          </ul>
        </>
      )}

      {layer === 'admin' && finding.admin_trace && (
        <div className="admin-block">
          <div>
            <span className="admin-label">admin</span>
            rule_id: <code>{finding.admin_trace.rule_id}</code> &nbsp;|&nbsp;
            pattern: <code>{finding.admin_trace.pattern}</code>
          </div>
          {finding.admin_trace.i18n_text_internal && (
            <div style={{ marginTop: 4 }}>{finding.admin_trace.i18n_text_internal}</div>
          )}
          {finding.admin_trace.mechanism && (
            <div className="admin-mech">{finding.admin_trace.mechanism}</div>
          )}
          {finding.sources?.length > 0 && (
            <div className="admin-sources">Sources: {finding.sources.join(' · ')}</div>
          )}
        </div>
      )}
    </div>
  );
}

function ForecastSection({ forecast, locale, layer }) {
  const g = forecast.glp1_dosing;
  return (
    <div className="forecast-grid">
      <div className="decision-card">
        <div className="sub-label" style={{ marginTop: 0 }}>{t(locale, 'subsection_glp1_decision')} <span className={`grade-badge grade-${g.evidence_grade}`} style={{ marginInlineStart: 8 }}>{g.evidence_grade}</span></div>
        <div className={`decision-value ${g.decision}`}>{g.decision}</div>
        <div className="decision-desc">{g.i18n_text}</div>
        {g.rationale_i18n_texts?.length > 0 && (
          <div className="rationale">
            <ul>
              {g.rationale_i18n_texts.map((r, i) => <li key={i}>— {r}</li>)}
            </ul>
          </div>
        )}
      </div>

      {forecast.future_risks?.length > 0 && (
        <div className="decision-card">
          <div className="sub-label" style={{ marginTop: 0 }}>{t(locale, 'subsection_future_risks')}</div>
          {forecast.future_risks.map((r, i) => (
            <div className="risk-row" key={i}>
              <div className="risk-tf">+{r.timeframe_weeks}w</div>
              <div className="risk-text">{r.i18n_text}</div>
              <span className={`grade-badge grade-${r.evidence_grade}`}>{r.evidence_grade}</span>
            </div>
          ))}
        </div>
      )}

      {forecast.chronic_med_adjustments?.length > 0 && (
        <div className="decision-card">
          <div className="sub-label" style={{ marginTop: 0 }}>{t(locale, 'subsection_chronic_adj')}</div>
          {forecast.chronic_med_adjustments.map((c, i) => (
            <div className="risk-row" key={i}>
              <div className="risk-tf">+{c.timeframe_weeks}w</div>
              <div className="risk-text">
                <strong>{c.medication_name}</strong> · {c.adjustment_i18n_text}
                <div style={{ fontSize: 12, color: 'var(--ink-quiet)', fontStyle: 'italic', marginTop: 2 }}>
                  {c.trigger_i18n_text}
                </div>
              </div>
              <span className={`grade-badge grade-${c.evidence_grade}`}>{c.evidence_grade}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function SignOffPanel({ locale, status, onSign, signing, onNewVisit }) {
  const [phyId, setPhyId] = useState("");
  const [phyName, setPhyName] = useState("");
  const [signStatus, setSignStatus] = useState("signed");
  const [notes, setNotes] = useState("");

  const isSigned = status !== 'pending_sign_off';

  return (
    <div className="signoff-panel">
      <div className="signoff-title">
        {t(locale, 'section_signoff')}
        <span className={`signoff-status ${isSigned ? status : 'pending'}`}>
          {t(locale, 'status_' + (isSigned ? status : 'pending'))}
        </span>
      </div>
      <div className="signoff-sub">{t(locale, 'signoff_sub')}</div>

      {!isSigned && (
        <>
          <div className="field-grid">
            <Field label={t(locale, 'f_physician_id')}><input className="input" value={phyId} onChange={e => setPhyId(e.target.value)} placeholder="DR-001" /></Field>
            <Field label={t(locale, 'f_physician_name')}><input className="input" value={phyName} onChange={e => setPhyName(e.target.value)} placeholder="Dr. ..." /></Field>
            <Field label={t(locale, 'f_signoff_status')}>
              <select className="select" value={signStatus} onChange={e => setSignStatus(e.target.value)}>
                <option value="signed">{t(locale, 'status_signed')}</option>
                <option value="rejected">{t(locale, 'status_rejected')}</option>
                <option value="amended">{t(locale, 'status_amended')}</option>
              </select>
            </Field>
          </div>
          <div className="field" style={{ marginTop: 12 }}>
            <span className="field-label">{t(locale, 'f_signoff_notes')}</span>
            <textarea className="textarea" rows="3" value={notes} onChange={e => setNotes(e.target.value)} />
          </div>
          <div className="cta-row">
            <button className="btn-primary" disabled={signing || !phyId || !phyName}
              onClick={() => onSign({ physician_id: phyId, physician_name: phyName, status: signStatus, notes })}>
              {signing ? <><span className="spinner"></span> &nbsp; {t(locale, 'signing')}</> : t(locale, 'btn_sign')}
            </button>
          </div>
        </>
      )}

      {isSigned && (
        <div className="cta-row">
          <button className="btn-secondary" onClick={onNewVisit}>{t(locale, 'btn_new_visit')}</button>
        </div>
      )}
    </div>
  );
}

// ============================================================
// App
// ============================================================
function App() {
  const [locale, setLocale] = useState('ru');
  const [layer, setLayer] = useState('clinical');
  const [patient, setPatient] = useState(emptyPatient());
  const [result, setResult] = useState(null);
  const [submitting, setSubmitting] = useState(false);
  const [signing, setSigning] = useState(false);
  const [toast, setToast] = useState(null);

  // Sync document direction with locale
  useEffect(() => {
    document.documentElement.dir = directionFor(locale);
    document.documentElement.lang = locale;
  }, [locale]);

  const showToast = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2400);
  }, []);

  const handleAssess = useCallback(async () => {
    setSubmitting(true);
    try {
      const r = await callAssess(patient, locale);
      setResult(r);
      showToast(t(locale, 'toast_assessed'));
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) {
      showToast(String(e));
    } finally {
      setSubmitting(false);
    }
  }, [patient, locale, showToast]);

  const handleSignOff = useCallback(async (payload) => {
    if (!result) return;
    setSigning(true);
    try {
      const r = await callSignOff(result.visit_id, payload);
      setResult(prev => ({ ...prev, sign_off_status: r.status }));
      showToast(t(locale, 'toast_signed'));
    } catch (e) {
      showToast(String(e));
    } finally {
      setSigning(false);
    }
  }, [result, locale, showToast]);

  const handleNewVisit = useCallback(() => {
    setResult(null);
    setPatient(emptyPatient());
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, []);

  return (
    <div className="app">
      <Header locale={locale} setLocale={setLocale} layer={layer} setLayer={setLayer} />

      {!result && (
        <PatientForm
          locale={locale}
          patient={patient}
          setPatient={setPatient}
          onSubmit={handleAssess}
          submitting={submitting}
        />
      )}

      {result && (
        <AssessmentResult
          locale={locale}
          layer={layer}
          result={result}
          onSignOff={handleSignOff}
          onNewVisit={handleNewVisit}
          signing={signing}
        />
      )}

      <footer>
        <span>{t(locale, 'footer_version', { rp: result?.rule_pack_version || '1.0.0', dd: result?.drug_db_version || '1.0.0' })}</span>
        <span style={{ fontFamily: 'var(--serif)', fontStyle: 'italic', fontSize: 12 }}>{t(locale, 'footer_disclaimer')}</span>
      </footer>

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
