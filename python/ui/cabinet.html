<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>METACOD — Кабинет (v2 · опросник 153)</title>
<style>
  :root{
    --bg:#eef3f3; --surface:#ffffff; --teal:#0e7c86; --teal-deep:#0a5b63;
    --ink:#15302f; --muted:#5d716f; --line:#dde7e6; --amber:#9a6400; --amber-bg:#fbf2dd;
    --danger:#b3261e; --danger-bg:#fbe9e7; --ok:#127a52; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:16px}
  .word{font-family:Georgia,"Times New Roman",serif;letter-spacing:.5px}
  .teal{color:var(--teal-deep)}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:11px 14px}
  .btn{background:var(--teal);color:#fff;font-weight:700}
  .btn:active{background:var(--teal-deep)}
  .btn-ghost{background:#fff;color:var(--teal-deep);border:1px solid var(--line);font-weight:600}
  .btn-sm{padding:7px 10px;border-radius:9px;font-size:13px}
  input,textarea,select{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);
    border-radius:10px;background:#fff;color:var(--ink)}
  textarea{min-height:64px;resize:vertical}
  label{display:block;font-size:12.5px;color:var(--muted);margin:8px 0 3px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:12px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row>*{flex:1;min-width:120px}
  h1{font-size:22px;margin:0 0 2px}
  h2{font-size:15px;margin:18px 0 8px;color:var(--teal-deep);text-transform:uppercase;letter-spacing:.6px}
  .muted{color:var(--muted)}
  .small{font-size:12.5px}
  /* header */
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--teal-deep);color:#fff;border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
  .top .who{font-family:Georgia,serif;font-size:18px}
  .top .sub{font-size:12px;opacity:.85}
  .pill{display:inline-block;background:#fff;color:var(--teal-deep);border-radius:999px;
    padding:3px 10px;font-size:12px;font-weight:700}
  /* tabs */
  .tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px;-webkit-overflow-scrolling:touch}
  .tab{white-space:nowrap;background:#fff;border:1px solid var(--line);color:var(--teal-deep);
    border-radius:999px;padding:8px 13px;font-weight:600;font-size:13px}
  .tab.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  /* timeline (signature) */
  .tl{position:relative;margin-left:8px;padding-left:18px;border-left:2px solid var(--line)}
  .tl .ev{position:relative;margin-bottom:14px}
  .tl .ev::before{content:"";position:absolute;left:-25px;top:4px;width:11px;height:11px;
    border-radius:50%;background:var(--teal);border:2px solid #fff;box-shadow:0 0 0 2px var(--line)}
  .tl .ev.analysis::before{background:var(--amber)}
  .tl .ev.symptom::before{background:#7a5cc7}
  .tl .ev.rx::before{background:var(--ok)}
  .ev .when{font-size:11.5px;color:var(--muted)}
  .ev .what{font-weight:600}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;margin-left:6px}
  .tag.pt{background:#efeaf9;color:#5a40a8}
  .tag.dr{background:#e2f1f0;color:var(--teal-deep)}
  .tag.ord{background:var(--amber-bg);color:var(--amber)}
  .tag.rec{background:#e6f4ec;color:var(--ok)}
  .flag{background:var(--danger-bg);border:1px solid #f3c9c4;border-radius:10px;padding:10px 12px;color:#7a1610;font-size:13px;margin-bottom:8px}
  .note{background:var(--amber-bg);border:1px solid #ecd9a8;border-radius:10px;padding:10px 12px;color:#5d4300;font-size:13px}
  .list-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
  .list-item .meta{font-size:12px;color:var(--muted)}
  .seg{display:flex;gap:6px;margin-bottom:14px}
  .seg button{flex:1;background:#fff;border:1px solid var(--line);color:var(--teal-deep);font-weight:700}
  .seg button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .footer-note{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.5}
  .empty{color:var(--muted);font-size:13px;padding:8px 0}
  .add-row{display:flex;gap:8px;margin-top:8px}
  .add-row input{flex:1}
  .hide{display:none}
  a.link{color:var(--teal-deep);font-weight:600;text-decoration:none}
  .langbar{display:flex;gap:4px}
  .langbtn{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700}
  .langbtn.on{background:#fff;color:var(--teal-deep)}
  [dir="rtl"] .tabs, [dir="rtl"] .row, [dir="rtl"] .add-row, [dir="rtl"] .seg{direction:rtl}
  [dir="rtl"] .top{flex-direction:row-reverse}
  #print-area{display:none}
  .rx-sheet{font-family:Georgia,serif;color:#111;max-width:620px}
  .rx-sheet h3{margin:0 0 2px;font-size:20px}
  .rx-sheet .rx-line{padding:8px 0;border-bottom:1px dotted #bbb}
  .rx-sheet .rx-sign{margin-top:40px;display:flex;justify-content:space-between}
  .rep{font-family:Georgia,serif;color:#15302f;line-height:1.5}
  .rep-h{font-size:21px;font-weight:700;color:#0a5b63}
  .rep-sub{font-size:12px;color:#5d716f;margin-bottom:12px}
  .rep-row{margin:4px 0}
  .rep-sec{font-weight:700;color:#0a5b63;margin:14px 0 4px;border-bottom:1px solid #dde7e6;padding-bottom:3px}
  .rep-disc{margin-top:16px;font-size:12px;color:#5d716f;border-top:1px solid #dde7e6;padding-top:8px}
  .filebtn{display:inline-block;background:#fff;color:var(--teal-deep);border:1px solid var(--line);border-radius:11px;padding:11px 14px;font-weight:700;cursor:pointer}.filebtn:active{background:#eef3f3}
  .fqsec{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
  .fqh{font-weight:700;color:var(--teal-deep);border-bottom:2px solid var(--teal);padding-bottom:4px;margin-bottom:8px}
  .fqrow{margin:10px 0}.fqrow label{display:block;color:var(--muted);font-size:14px;margin-bottom:4px}
  .fqopts{display:flex;flex-wrap:wrap;gap:6px}
  .fqopt{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 11px;font-size:14px;font-weight:600;cursor:pointer}
  .fqopt.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .fqrow input,.fqrow textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px}
  .fqwarn{background:#fbf2dd;border:1px solid #ecd9a8;border-radius:8px;padding:10px;font-size:13px;margin:6px 0}
  @media print{
    body *{visibility:hidden}
    #print-area, #print-area *{visibility:visible}
    #print-area{display:block;position:absolute;left:0;top:0;width:100%;padding:28px}
  }
</style>

    var d=DB350[i], hits=[], score=0, syms=d.symptoms||[];
    for(var k=0;k<syms.length;k++){

      for(var jj=0;jj<kws.length;jj++){ if(kws[jj] && blob.indexOf(kws[jj])>=0){ hits.push(syms[k]); score++; break; } }

function tokenMatch(t,s){
  switch(t){
    case "@hr_low": return s.hr!=null && s.hr<60;
    case "@hr_high": return s.hr!=null && s.hr>100;
    case "@temp_low": return s.temp!=null && s.temp<36.3;
    case "@bp_high": return ((s.sbp||0)>=130 || (s.dbp||0)>=85);
    case "@age_old": return s.age!=null && s.age>=60;
    default: return false;
  }
}
function evMatched(it,s){
  if(it.sym){ for(const id of it.sym) if((s.symIds||[]).indexOf(id)>=0) return true; }
  for(const m of it.match){
    if(m.charAt(0)==="@"){ if(tokenMatch(m,s)) return true; }
    else if(s.blob.indexOf(m)>=0) return true;
  }
  return false;
}

  for(const id in DX_META){
    const meta=DX_META[id]; let total=0,got=0; const matched=[],missing=[];
    for(const it of meta.evidence){ total+=it.weight;

      else missing.push({cat:it.cat,text:it.text,confirms:it.confirms}); }
    if(!matched.length) continue;
    out.push({id, name:DX_NAMES[id]||meta.name||id, matchPct: total? Math.round(got/total*100):0,
      matched, missing, confirm:meta.confirm, workup:meta.workup,
      treatmentToday:meta.treatmentToday, treatmentFinal:meta.treatmentFinal, followUp:meta.followUp, cautions:meta.cautions||[]});

}

function buildSignalsFromPatient(p, extra){

  if(p.allergies) parts.push(p.allergies);
  const blob=parts.join(" ").toLowerCase();
  const num=x=>{const n=parseFloat(x);return isFinite(n)?n:undefined;};
  let age; if(p.dob){ const d=new Date(p.dob); if(!isNaN(d)) age=Math.floor((Date.now()-d.getTime())/(365.25*86400000)); }
  if(age==null && extra.age!=null) age=num(extra.age);
  const symIds = (extra.symIds && extra.symIds.length) ? extra.symIds : Object.keys(p.checklist||{}).filter(id=>p.checklist[id]);
  return { blob, symIds, age, hr:num(extra.hr), temp:num(extra.temp), sbp:num(extra.sbp), dbp:num(extra.dbp),
    allergies:String(p.allergies||"").toLowerCase(), medsText:(p.meds||[]).map(m=>m.name.toLowerCase()).join(" "),
    pregnant: !!extra.pregnant, renalRisk: /почк|хбп|почечн|креатинин|диализ|скф|нефро/.test(blob) };

function parseAnketaCode(txt){
  const m=txt.match(/\[METACOD-КОД\]([\s\S]*)$/); if(!m) return null;
  const line=m[1];
  const get=(k)=>{ const r=line.match(new RegExp(k+"=([^;]*)")); return r?r[1].trim():""; };
  const num=x=>{const n=parseFloat(x);return isFinite(n)?n:undefined;};
  const bp=get("bp").split("/");
  // имя: из кода (name=) или из строки "Имя:/Name:/שם:"
  let name=get("name");
  if(!name){ const nm=txt.match(/(?:Имя|Name|שם)\s*:\s*([^\n]+)/i); if(nm) name=nm[1].trim(); }
  return { name:name, symIds:get("sym").split(",").map(x=>x.trim()).filter(Boolean), age:num(get("age")),
    sex:get("sex"), sbp:num(bp[0]), dbp:num(bp[1]), hr:num(get("hr")), pregnant:get("preg")==="1",
    meds:get("meds"), allergies:get("alg"), complaint:get("c") };
}

function buildReportText(p,dx,pc,extra){
  extra=extra||{};
  const lines=["МЕДИЦИНСКОЕ ЗАКЛЮЧЕНИЕ — METACOD"];
  let age=""; if(p.dob){const d=new Date(p.dob); if(!isNaN(d)) age=Math.floor((Date.now()-d.getTime())/(365.25*86400000));} if(age===""&&extra.age!=null) age=extra.age;
  lines.push("Пациент: "+(p.name||"")+(age?(" · "+age):""));
  var fqp=(extra.fqParts||[]); if(extra.complaint||fqp.length) lines.push("Жалобы и симптомы: "+[extra.complaint].concat(fqp).filter(Boolean).join("; "));
  const meds=(p.meds||[]).map(m=>m.name+(m.dose?(" "+m.dose):"")).join("; "); if(meds) lines.push("Лекарства: "+meds);
  if(p.allergies) lines.push("Аллергии: "+p.allergies);
  if(pc.length) lines.push("Предостережения: "+pc.join(" | "));
  lines.push(""); lines.push("Предполагаемые диагнозы:");
  dx.slice(0,5).forEach(d=>{ lines.push("• "+d.matchPct+"% "+d.name);
    if(d.workup){const w=[].concat(d.workup.labs,d.workup.imaging,d.workup.procedures); if(w.length) lines.push("   обследование: "+w.join("; "));}
    lines.push("   сегодня: "+d.treatmentToday); lines.push("   после: "+d.treatmentFinal);
  });
  lines.push(""); lines.push("Это поддержка клинического решения, не окончательный диагноз. Препарат, доза и диагноз — решение лечащего врача.");
  return lines.join("\n");
}

function rxDoctorName(p){ const d=p.doctorId?getDoctor(p.doctorId):null; return d?(t("drPrefix")+d.name):t("docWord"); }
function rxLines(p){ return (p.prescriptions||[]).slice().sort((a,b)=>a.ts-b.ts)
    .map(rx=>"• "+rx.text+(rx.dose?(" — "+rx.dose):"")); }
function rxText(p){
  const dt=new Date().toLocaleDateString("ru-RU");
  return ["МЕДИЦИНСКОЕ НАЗНАЧЕНИЕ / РЕЦЕПТ","",
    "Пациент: "+p.name, "Дата рождения: "+(p.dob||"—"), "Дата: "+dt,
    "Врач: "+rxDoctorName(p), "",
    "Назначено:", ...(rxLines(p).length?rxLines(p):["—"]), "",
    (p.allergies?("Аллергии: "+p.allergies):""), "",
    "Подпись врача: ____________________",
    "","(METACOD — назначение для пациента; дозы — по решению врача)"].filter(x=>x!==null).join("\n");
}
function printRx(p){
  const dt=new Date().toLocaleDateString("ru-RU");
  document.getElementById("print-area").innerHTML = `
    <div class="rx-sheet">
      <h3>Медицинское назначение / Рецепт</h3>
      <div style="font-size:12px;color:#555;margin-bottom:14px">METACOD</div>
      <div><b>Пациент:</b> ${esc(p.name)} &nbsp; <b>Д.р.:</b> ${esc(p.dob||"—")}</div>
      <div><b>Дата:</b> ${dt} &nbsp; <b>Врач:</b> ${esc(rxDoctorName(p))}</div>
      ${p.allergies?`<div style="color:#a11">Аллергии: ${esc(p.allergies)}</div>`:""}
      <div style="margin:16px 0 6px"><b>Rp:</b></div>
      ${rxLines(p).length?rxLines(p).map(l=>`<div class="rx-line">${esc(l)}</div>`).join(""):'<div class="rx-line">—</div>'}
      <div class="rx-sign"><span>Подпись: ____________</span><span>${dt}</span></div>
      <div style="margin-top:18px;font-size:11px;color:#666">Дозы — по решению лечащего врача.</div>
    </div>`;
  window.print();
}
function emailRx(p){
  const subj="Назначение — "+p.name;
  location.href="mailto:?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(rxText(p));
}
function telegramRx(p){
  const url="https://t.me/share/url?url="+encodeURIComponent("METACOD")+"&text="+encodeURIComponent(rxText(p));
  const w=window.open(url,"_blank"); if(!w){ location.href=url; }
}
function bindRxShare(p){
  const b1=document.getElementById("rx-print"); if(b1) b1.onclick=()=>printRx(p);
  const b2=document.getElementById("rx-email"); if(b2) b2.onclick=()=>emailRx(p);
  const b3=document.getElementById("rx-tg"); if(b3) b3.onclick=()=>telegramRx(p);
}


/* ---------- документы личности: сжатие + статус ---------- */
function readCompressedImage(file, cb){
  if(!file){ cb(null); return; }
  const reader=new FileReader();
  reader.onload=()=>{ const img=new Image();
    img.onload=()=>{ const max=1000; let w=img.width,h=img.height;
      const sc=Math.min(1,max/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      try{ cb(c.toDataURL("image/jpeg",0.6)); }catch(e){ cb(null); } };
    img.onerror=()=>cb(null); img.src=reader.result; };
  reader.onerror=()=>cb(null); reader.readAsDataURL(file);
}
function vBadge(st){ return st==="verified"?`<span class="tag rec">${t('st_verified')}</span>`
  : st==="rejected"?`<span class="tag" style="background:#fbe9e7;color:#b3261e">${t('st_rejected')}</span>`

function isPatientVerified(p){ return !!(p && (p.adminCreated || (p.idDoc && p.idDoc.status==="verified"))); }

  return d.license ? vBadge(d.license.status) : `<span class="tag" style="background:#eee;color:#777">${t('st_nolic')}</span>`; }

  return p.idDoc ? vBadge(p.idDoc.status) : `<span class="tag" style="background:#eee;color:#777">${t('st_nodoc')}</span>`; }

/* ---------- утилиты ---------- */
const uid = () => Math.random().toString(36).slice(2,9);
function hashId(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return "p"+h.toString(36); }
function fmt(ts){ const d=new Date(ts); return d.toLocaleDateString("ru-RU",{day:"2-digit",month:"short",year:"numeric"}); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function daysFromNow(n){ return Date.now()+n*86400000; }

function db(){ const a=Store.readAll(); if(!a.patients) a.patients={}; if(!a.doctors) a.doctors={}; return a; }
function save(a){ Store.writeAll(a); }
function getPatient(id){ return db().patients[id]||null; }
function upsertPatient(p){ const a=db(); a.patients[p.id]=p; save(a); }
function newPatient(name,dob,passport,doctorId){
  return { id:hashId(name.trim().toLowerCase()+"|"+dob+"|"+passport.trim()), doctorId: doctorId||"",
    name:name.trim(), dob, passLast: passport.trim().slice(-4),
    allergies:"", meds:[], symptoms:[], analyses:[], prescriptions:[], visits:[], reminders:[], idDoc:null, adminCreated:false, checklist:{} };
}
function getDoctor(id){ return db().doctors[id]||null; }
function upsertDoctor(d){ const a=db(); a.doctors[d.id]=d; save(a); }
function doctorIdByName(name){ return hashId("dr|"+name.trim().toLowerCase()); }
function ensureDoctor(name){ const id=doctorIdByName(name); let d=getDoctor(id); if(!d){ d={id,name:name.trim()}; upsertDoctor(d);} return d; }
function patientsOf(doctorId){ return Object.values(db().patients).filter(p=>p.doctorId===doctorId); }

function db350Detail(d){
  function esc2(x){return esc(x==null?"":x);}
  function L(label,val,color){ if(val==null||(Array.isArray(val)&&!val.length)||val==="")return ""; return '<div style="margin:3px 0"><b style="color:'+(color||"#15302f")+'">'+label+':</b> '+esc2(Array.isArray(val)?val.join(", "):val)+'</div>'; }
  var h='<div class="card">';
  h+='<h2 style="margin:0 0 6px;color:var(--teal-deep)">'+esc2(d.name_ru)+(d.name_en?' ('+esc2(d.name_en)+')':'')+(d.icd10?' — МКБ-10 '+esc2(d.icd10):'')+'</h2>';
  h+=L("Категория", d.category);
  h+='<div style="font-weight:700;color:#1f4e79;margin-top:8px">Диагноз по METACOD</div>';
  h+=L("Энергоизбыток", d.excess, "#1f4e79");
  h+=L("Энергодефицит", d.deficit, "#1f4e79");
  h+=L("Мембрана", (d.membrane||"—")+" → "+(d.direction||""), "#1f4e79");
  if(d.revici&&d.revici.length) h+=L("Уровень (Revici)", d.revici.join(", ")+(d.chronicity!=null?" · хроничность "+d.chronicity:""), "#1f4e79");
  h+='<div style="font-weight:700;color:#9a3412;margin-top:8px">Алгоритм</div>';
  h+=L("Протокол", d.protocol, "#9a3412");
  h+=L("Режим", d.mode, "#9a3412");
  h+=L("Симптомы входа", d.symptoms);
  h+=L("Диагностика", d.labs);
  h+='<div style="font-weight:700;color:var(--teal-deep);margin-top:8px">Схема лечения (цзюнь-чэнь-цзо-ши)</div>';
  h+=L("Государь — полная доза", d.jun);
  h+=L("Министры — 70–100%", d.chen);
  h+=L("Помощники — 30–50%", d.zuo);
  h+=L("Посланник — 10–20%", d.shi);
  if(d.glp1){ var pp=[]; if(d.glp1.agents&&d.glp1.agents.length)pp.push("предпочтительно: "+d.glp1.agents.join(", ")); if(d.glp1.inter&&d.glp1.inter.length)pp.push("⚠ взаимодействия: "+d.glp1.inter.join(", ")); h+=L("GLP-1","показан"+(pp.length?"; "+pp.join("; "):""),"#9a3412"); }
  h+='<div class="note small" style="margin-top:10px">Энергии — диагностический язык метода; препараты реальные клинические. Окончательный препарат, доза и решение — за врачом. Абсолютные дозы добавляются отдельно.</div>';
  h+='</div>';
  return h;
}

    (o.symIds||[]).forEach(id=>tmp.checklist[id]=true);

    const dx=scoreDifferential(sig); const pc=patientCautions(sig);
    document.getElementById("an-info").innerHTML=`<div class="card"><b>${t('patientLabel')}:</b> ${esc(tmp.name)}`+

    document.getElementById("an-result").innerHTML='<div class="card">'+diffResultHTML(dx,pc,false)+
      '<div style="margin-top:10px"><button class="btn-ghost" id="an-report-go">'+t('reportBtn')+'</button></div></div>';
    document.getElementById("an-report-go").onclick=()=>{

      document.getElementById("print-area").innerHTML=rep+imgs;
      const repText=buildReportText(tmp,dx,pc,extra);
      document.getElementById("an-report").innerHTML='<div class="card">'+rep+imgs+'<div style="margin-top:10px"><button class="btn-ghost" id="an-print">'+t('printReport')+'</button></div>'+editTranslateHTML()+'</div>'+sendBlockHTML();
      document.getElementById("an-print").onclick=()=>window.print();
      bindEditTranslate(repText);

    };
    document.getElementById("an-report-go").onclick();   // заключение показываем сразу

}

function renderAdmin(){

  const unassigned=pts.filter(p=>!p.doctorId || !a.doctors[p.doctorId]);
  const feed=[];
  pts.forEach(p=>{
    p.symptoms.forEach(x=>feed.push({ts:x.ts,who:x.by,pt:p.name,pid:p.id,what:"жалоба/симптом",detail:x.text}));
    p.analyses.forEach(x=>feed.push({ts:x.ts,who:x.by,pt:p.name,pid:p.id,what:"анализ "+(x.status==="received"?"(получен)":"(заказан)"),detail:x.name+(x.result?" — "+x.result:"")}));
    p.prescriptions.forEach(x=>feed.push({ts:x.ts,who:"doctor",pt:p.name,pid:p.id,what:"назначение",detail:x.text+(x.dose?" "+x.dose:"")}));
    p.visits.forEach(x=>feed.push({ts:x.ts,who:"doctor",pt:p.name,pid:p.id,what:"визит",detail:x.complaint}));
  });
  feed.sort((x,y)=>y.ts-x.ts);
  const ptAdds=feed.filter(e=>e.who==="patient").length;
  const docRow=(d,count,overdue)=>`
    <div class="list-item" data-opendr="${d.id}" style="cursor:pointer">
      <div class="what">Д-р ${esc(d.name)} ${vBadgeDoctor(d)}</div>
      <div class="meta">пациентов: ${count}${overdue?` · <b style="color:#b3261e">просроченных контролей: ${overdue}</b>`:""}</div>
    </div>`;

    <div class="top"><div><div class="who word">METACOD · ${esc(S.adminName||"Администратор")}</div>

      ${docs.length? docs.map(d=>{
        const cnt=patientsOf(d.id).length;

      <div class="add-row"><input id="ad-newdr" placeholder="${t('ph_drname')}"/><button class="btn btn-sm" id="ad-adddr">${t('addDoctor')}</button></div>
    </div>
    <div class="card" id="ad-verify"></div>
    <div class="card" id="ad-slices"></div>
    <div class="card">
      <h2 style="margin-top:0">${t('allActions')}</h2>
      <div class="tl">${feed.length? feed.slice(0,40).map(e=>`
        <div class="ev ${e.what.indexOf('анализ')>=0?'analysis':e.what.indexOf('жалоб')>=0?'symptom':e.what.indexOf('назнач')>=0?'rx':''}">
          <div class="when">${fmt(e.ts)} · <a class="link" data-openpt="${e.pid}">${esc(e.pt)}</a></div>
          <div class="what">${esc(e.what)} ${e.who==="patient"?`<span class="tag pt">${t('byPatient')}</span>`:`<span class="tag dr">${t('byDoctor')}</span>`}</div>

  const docDocs=docs.filter(d=>d.license);
  const ptDocs=pts.filter(p=>p.idDoc);
  const thumb=u=>`<img src="${u}" style="max-width:160px;border:1px solid var(--line);border-radius:8px;margin-top:6px"/>`;
  const vbtns=(vAttr,rAttr,id)=>`<div class="add-row" style="margin-top:6px">

  document.querySelectorAll("[data-rdoc]").forEach(b=>b.onclick=()=>setDoc(b.getAttribute("data-rdoc"),"rejected"));
  document.querySelectorAll("[data-vpt]").forEach(b=>b.onclick=()=>setPt(b.getAttribute("data-vpt"),"verified"));
  document.querySelectorAll("[data-rpt]").forEach(b=>b.onclick=()=>setPt(b.getAttribute("data-rpt"),"rejected"));
  const now=Date.now(), d30=now-30*86400000;
  const overdue=[]; pts.forEach(p=>p.reminders.filter(r=>!r.done&&r.dueTs<now).forEach(r=>overdue.push({p,r})));
  const noRx=pts.filter(p=>p.prescriptions.length===0);

    const v=mine.reduce((n,p)=>n+p.visits.filter(x=>x.ts>=d30).length,0);

    ${act.length? act.map(a=>`<div class="list-item"><div class="what">Д-р ${esc(a.name)}</div>
        <div class="meta">${t('patientsWord')}: ${a.patients} · ${t('metaVisits')}: ${a.v} · ${t('rxWord')}: ${a.rx}</div></div>`).join("") : '<div class="empty">'+t('emptyNoDoctors')+'</div>'}
  `;
  document.querySelectorAll("#ad-slices [data-openpt]").forEach(el=>el.onclick=()=>{S.patientId=el.getAttribute("data-openpt");S.tab="timeline";render();});
  document.querySelectorAll("[data-opendr]").forEach(el=>el.onclick=()=>{ S.doctorId=el.getAttribute("data-opendr"); render(); });
  document.querySelectorAll(".tl [data-openpt]").forEach(el=>el.onclick=()=>{S.patientId=el.getAttribute("data-openpt");S.tab="timeline";render();});
}

/* ---------- секции ---------- */
function tabBtn(key,label){ return `<button class="tab ${S.tab===key?'on':''}" data-tab="${key}">${label}</button>`; }
function bindTabs(re){ document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.getAttribute("data-tab");re();}); }
function bindHeader(){ const l=document.getElementById("logout"); if(l) l.onclick=()=>{S={role:null,patientId:null,tab:"timeline"};render();}; }

function timelineHTML(p){
  const ev=[];
  p.visits.forEach(v=>ev.push({ts:v.ts,cls:"",what:"Визит",detail:`${esc(v.complaint)}${v.differential?` — ${esc(v.differential)}`:""}${v.plan?`<br><span class="muted small">План: ${esc(v.plan)}</span>`:""}${v.followUp?`<br><span class="muted small">Контроль: ${esc(v.followUp)}</span>`:""}`,by:"doctor"}));
  p.symptoms.forEach(s=>ev.push({ts:s.ts,cls:"symptom",what:"Жалоба/симптом",detail:esc(s.text),by:s.by}));
  p.analyses.forEach(an=>ev.push({ts:an.ts,cls:"analysis",what:"Анализ: "+esc(an.name),detail:an.status==="received"?`Результат: ${esc(an.result||"—")}`:"Заказан, ожидается",by:an.by,status:an.status}));
  p.prescriptions.forEach(rx=>ev.push({ts:rx.ts,cls:"rx",what:"Назначение: "+esc(rx.text),detail:esc(rx.dose||""),by:"doctor"}));
  ev.sort((a,b)=>b.ts-a.ts);
  if(!ev.length) return `<div class="card"><div class="empty">${t('emptyFeed')}</div></div>`;
  return `<div class="card"><h2 style="margin-top:0">${t('history')}</h2><div class="tl">${ev.map(e=>`
    <div class="ev ${e.cls}">
      <div class="when">${fmt(e.ts)}</div>
      <div class="what">${e.what}
        ${e.by==="patient"?`<span class="tag pt">${t('byPatient')}</span>`:`<span class="tag dr">${t('byDoctor')}</span>`}
        ${e.status==="ordered"?`<span class="tag ord">${t('an_ordered')}</span>`:e.status==="received"?`<span class="tag rec">${t('an_received')}</span>`:''}</div>
      <div class="small">${e.detail}</div>
    </div>`).join("")}</div></div>`;
}

function allergyMedHTML(p){
  return `<div class="card">
    <h2 style="margin-top:0">${t('allergiesMeds')}</h2>
    ${p.allergies?`<div class="flag">${t('allergyWord')}: ${esc(p.allergies)}</div>`:`<div class="muted small">${t('noAllergy')}</div>`}
    <label>${t('allergyEditLabel')}</label>
    <div class="add-row"><input id="alg" value="${esc(p.allergies)}"/><button class="btn btn-sm" id="alg-save">${t('saveBtn')}</button></div>
    <label style="margin-top:10px">${t('currentMeds')}</label>
    ${p.meds.length?p.meds.map((m,i)=>`<div class="list-item"><b>${esc(m.name)}</b> <span class="meta">${esc(m.dose||"")}</span>
        <button class="btn-ghost btn-sm" data-delmed="${i}" style="float:right">${t('removeBtn')}</button></div>`).join(""):'<div class="empty">'+t('noRecords')+'</div>'}
    <div class="add-row"><input id="med-name" placeholder="${t('phMedName')}"/><input id="med-dose" placeholder="${t('ph_dose')}"/><button class="btn btn-sm" id="med-add">+</button></div>
  </div>`;
}

function symptomsHTML(p, canAdd){
  const items = p.symptoms.slice().sort((a,b)=>b.ts-a.ts);
  return `<div class="card"><h2 style="margin-top:0">Жалобы и симптомы</h2>
    ${items.length?items.map(s=>`<div class="list-item"><div class="what">${esc(s.text)}</div>
      <div class="meta">${fmt(s.ts)} · ${s.by==="patient"?"добавил пациент":"врач"}</div></div>`).join(""):'<div class="empty">Пока нет.</div>'}
    ${canAdd?`<label>${t('lbl_newSym')}</label>
      <div class="add-row"><input id="sym-text" placeholder="${t('ph_sym')}"/><button class="btn btn-sm" id="sym-add">Добавить</button></div>`:""}
  </div>`;
}

function analysesHTML(p, canAddResult, isDoctor){
  const items=p.analyses.slice().sort((a,b)=>b.ts-a.ts);
  return `<div class="card"><h2 style="margin-top:0">${t('tab_analyses')}</h2>
    ${items.length?items.map(an=>`<div class="list-item">
      <div class="what">${esc(an.name)} ${an.status==="received"?`<span class="tag rec">${t('an_received')}</span>`:`<span class="tag ord">${t('an_ordered')}</span>`}</div>
      <div class="meta">${fmt(an.ts)} · ${an.by==="patient"?"добавил пациент":"назначил врач"}</div>
      ${an.status==="received"?`<div class="small">Результат: ${esc(an.result||"—")}</div>`:""}
      ${canAddResult&&an.status!=="received"?`<div class="add-row"><input data-res="${an.id}" placeholder="Внести результат"/><button class="btn-ghost btn-sm" data-resbtn="${an.id}">Получен</button></div>`:""}
    </div>`).join(""):'<div class="empty">'+t('noTests')+'</div>'}
    <label>${isDoctor?t('lbl_orderAn'):t('lbl_addAn')}</label>
    <div class="add-row"><input id="an-name" placeholder="${t('ph_an')}"/><button class="btn btn-sm" id="an-add">${isDoctor?t('orderBtn'):t('addBtn')}</button></div>
  </div>`;
}

function rxHTML(p, isDoctor){
  const items=p.prescriptions.slice().sort((a,b)=>b.ts-a.ts);
  return `<div class="card"><h2 style="margin-top:0">${t('tab_rx')}</h2>
    ${items.length?items.map((rx,i)=>`<div class="list-item"><div class="what">${esc(rx.text)} <span class="meta">${esc(rx.dose||"")}</span></div>
      <div class="meta">${fmt(rx.ts)} · ${t('byDoctor')}</div>
      ${isDoctor?`<button class="btn-ghost btn-sm" data-delrx="${i}" style="float:right;margin-top:-26px">${t('removeBtn')}</button>`:""}</div>`).join(""):'<div class="empty">'+t('noRx')+'</div>'}
    ${items.length?`<div class="add-row" style="margin-top:10px">
      <button class="btn-ghost btn-sm" id="rx-print">🖨 ${t('print')}</button>
      <button class="btn-ghost btn-sm" id="rx-email">✉ ${t('email')}</button>
      <button class="btn-ghost btn-sm" id="rx-tg">Telegram</button></div>`:""}
    ${isDoctor?`<label>${t('lbl_newRx')}</label>
      <div class="add-row"><input id="rx-text" placeholder="${t('ph_rx')}"/><input id="rx-dose" placeholder="${t('ph_dose')}"/><button class="btn btn-sm" id="rx-add">${t('prescribe')}</button></div>
      <div class="note small" style="margin-top:8px">${t('rxDisc')}</div>`:'<div class="muted small">'+t('rxByDoctor')+'</div>'}
  </div>`;
}

  const d=p.idDoc;
  return `<div class="card"><h2 style="margin-top:0">${t('tab_id')}</h2>
    ${d? `<div class="small">Документ загружен ${vBadge(d.status)}</div>
          <img src="${d.dataUrl}" style="max-width:100%;border:1px solid var(--line);border-radius:10px;margin-top:8px"/>
          <div class="meta">${esc(d.type||"документ")} · ${fmt(d.ts)}</div>
          <div style="margin-top:8px"><button class="btn-ghost btn-sm" id="id-replace">${t('replacePhoto')}</button></div>`
       : `<div class="note small">Чтобы подтвердить, что это вы — сфотографируйте паспорт или водительское удостоверение. Документ увидит только ваш врач и администратор для проверки.</div>
          <div style="margin-top:10px"><label>${t('lbl_docType')}</label>
          <select id="id-type"><option>${t('opt_passport')}</option><option>${t('opt_license')}</option><option>${t('opt_id')}</option></select></div>
          <div style="margin-top:8px"><label class="filebtn" onclick="document.getElementById('id-file').click()">${t('choosePhotos')}</label> <span class="small" id="id-file-count"></span><input type="file" id="id-file" accept="image/*" style="display:none" onchange="var c=document.getElementById('id-file-count');if(c)c.textContent=this.files.length?('✓ '+this.files.length):''"/></div>`}
    <div class="footer-note">⚠ В рабочей версии документ хранится в зашифрованном виде; после проверки оригинал не хранится в открытом доступе.</div>
  </div>`;
}

function remindersHTML(p, isDoctor){
  const items=p.reminders.slice().sort((a,b)=>a.dueTs-b.dueTs);
  return `<div class="card"><h2 style="margin-top:0">${t('reminders')}</h2>
    ${items.length?items.map((r,i)=>`<div class="list-item ${r.done?'':''}">
      <div class="what" style="${r.done?'text-decoration:line-through;color:#9aa':''}">${esc(r.text)}</div>
      <div class="meta">срок: ${fmt(r.dueTs)} ${r.dueTs<Date.now()&&!r.done?'· <b style="color:#b3261e">просрочено</b>':''}</div>
      <button class="btn-ghost btn-sm" data-remdone="${i}" style="float:right;margin-top:-26px">${r.done?"вернуть":"выполнено"}</button>
    </div>`).join(""):'<div class="empty">'+t('noReminders')+'</div>'}
    ${isDoctor?`<label>${t('lbl_newRem')}</label>
      <div class="add-row"><input id="rem-text" placeholder="${t('phReminder')}"/>
        <select id="rem-wk" style="max-width:130px"><option value="2">${t('weeks2')}</option><option value="3">${t('weeks3')}</option><option value="4" selected>${t('weeks4')}</option><option value="6">${t('weeks6')}</option></select>
        <button class="btn btn-sm" id="rem-add">+</button></div>`:""}
  </div>`;
}

function symLabelById(id){ for(var i=0;i<SYMPTOMS.length;i++){ var g=SYMPTOMS[i]; for(var j=0;j<g.items.length;j++){ if(g.items[j].id===id) return symLabel(g.items[j]); } } return id; }
function visitReportHTML(p,dx,pc,extra){
  const dt=new Date().toLocaleDateString("ru-RU");
  const symLabels=(extra.symIds||[]).map(symLabelById).concat(extra.fqParts||[]);
  const meds=(p.meds||[]).map(m=>esc(m.name+(m.dose?(" "+m.dose):""))).join("; ")||t('noData');
  const alg=esc(p.allergies||"")||t('noData');
  const comp=[extra.complaint, symLabels.join("; ")].filter(x=>x&&String(x).trim()).map(esc).join(" · ")||t('noData');
  let age=""; if(p.dob){ const d=new Date(p.dob); if(!isNaN(d)) age=Math.floor((Date.now()-d.getTime())/(365.25*86400000)); } if(age===""&&extra&&extra.age!=null) age=extra.age;
  return `<div class="rep">
    <div class="rep-h">${t('reportTitle')}</div>
    <div class="rep-sub">METACOD · ${dt}</div>
    <div class="rep-row"><b>${t('reportFor')}:</b> ${esc(p.name||"")} ${p.dob?("· "+esc(p.dob)):""}${age?(" · "+age):""}</div>
    <div class="rep-sec">${t('secComplaints')}</div><div class="rep-row">${comp}</div>
    <div class="rep-sec">${t('secMeds')}</div><div class="rep-row">${meds}</div>
    <div class="rep-sec">${t('secAlg')}</div><div class="rep-row">${alg}</div>
    <div class="rep-sec">${t('secSuspected')} · ${t('secWorkup')} · ${t('secTreatment')}</div>
    ${diffResultHTML(dx,pc,false)}
    <div class="rep-disc">${t('reportDisc')}</div>
  </div>`;
}

  return `<div class="card"><h2 style="margin-top:0">${t('tab_visit')}</h2>
    <div style="background:#f7faf9;border:1px dashed #b8ccca;border-radius:10px;padding:10px;margin-bottom:12px">
      <label style="margin-top:0">${t('pasteLabel')}</label>
      <textarea id="paste-anketa" placeholder="[METACOD-КОД] sym=...; age=...; bp=.../...; hr=...; ..."></textarea>

    ${fullQHTML()}
    <div style="margin-top:10px"><button class="btn" id="dx-calc" style="font-size:17px">${t('calc')}</button></div>
    <div id="dx-result"></div>
    <div style="margin-top:10px"><button class="btn-ghost" id="report-go">${t('reportBtn')}</button></div>

    <label style="margin-top:12px">${t('lbl_diff')}</label><textarea id="v-diff" placeholder="${t('phDiff')}"></textarea>

    <div class="row">
      <div><label>${t('lbl_fu')}</label><select id="v-fu"><option>${t('weeks2')}</option><option>${t('weeks3')}</option><option selected>${t('weeks4')}</option><option>${t('weeks6')}</option></select></div>
    </div>
    <div style="margin-top:12px"><button class="btn" id="v-save">${t('saveVisit')}</button></div>
    <div class="note small" style="margin-top:8px">${t('visitDisc')}</div>
  </div>`;
}

function diffResultHTML(dx, pc, forPatient){
  if(!dx.length) return `<div class="empty">${t('quizIntro')}</div>`;
  let h="";
  if(forPatient){ h+=`<div class="note small"><b>${esc(t('ptDisc'))}</b></div>`; }
  if(pc.length && !forPatient){ h+=`<div class="flag"><b>${t('patientCautions')}</b><br>${pc.map(function(x){return "• "+esc(x);}).join("<br>")}</div>`; }
  dx.slice(0,5).forEach(d=>{
    const conf=d.missing.find(m=>m.confirms);
    const checks=[]; if(d.workup){ checks.push.apply(checks,d.workup.labs); checks.push.apply(checks,d.workup.imaging); checks.push.apply(checks,d.workup.procedures); }
    if(forPatient){
      h+=`<div class="list-item">
        <div class="what">${d.matchPct}% — ${esc(d.name)}</div>
        <div class="small"><b>${t('why')}:</b> ${esc(d.matched.map(m=>m.text).slice(0,5).join("; "))}</div>
        ${checks.length?`<div class="small"><b>${t('whatToCheck')}:</b> ${esc(checks.join("; "))}</div>`:""}
      </div>`;
    } else {
      h+=`<div class="list-item">
        <div class="what">${d.matchPct}% — ${esc(d.name)}</div>
        <div class="small"><b>${t('why')}:</b> ${esc(d.matched.map(m=>m.text).slice(0,5).join("; "))}</div>
        <div class="small"><b>${t('to100')}:</b> ${conf?("получить "+esc(conf.text)):("дообследование: "+esc(d.confirm[0]||""))}</div>
        ${d.workup?`${d.workup.labs.length?`<div class="small">🩸 ${esc(d.workup.labs.join("; "))}</div>`:""}
          ${d.workup.imaging.length?`<div class="small">🖼 ${esc(d.workup.imaging.join("; "))}</div>`:""}
          ${d.workup.procedures.length?`<div class="small">🔬 ${esc(d.workup.procedures.join("; "))}</div>`:""}`:""}
        <div class="small">💊 <b>${t('today')}:</b> ${esc(d.treatmentToday)}</div>
        <div class="small">✓ <b>${t('after')}:</b> ${esc(d.treatmentFinal)}</div>
        <div class="small">📅 ${esc(d.followUp)}</div>
        ${d.cautions.map(c=>`<div class="small" style="color:#7a1610">⚠ ${esc(c)}</div>`).join("")}
      </div>`;
    }
  });
  if(!forPatient){ h += db350MatchesHTML(DB350_BLOB); }
  return h;
}

function quizHTML(p){
  return `<div class="card"><h2 style="margin-top:0">${t('tab_quiz')}</h2>
    <p class="muted small">${t('quizIntro')}</p></div>
    ${fullQHTML()}
    <div style="margin:10px 0"><button class="btn" id="quiz-go">${t('showCauses')}</button></div>
    <div id="quiz-result"></div>`;
}

/* ---------- действия ---------- */
function bindPatientActions(p){
  bindFQ();
  const symAdd=document.getElementById("sym-add");
  if(symAdd) symAdd.onclick=()=>{ const t=document.getElementById("sym-text").value.trim(); if(!t)return;
    p.symptoms.push({id:uid(),text:t,by:"patient",ts:Date.now()}); upsertPatient(p); renderPatient(); };
  const anAdd=document.getElementById("an-add");
  if(anAdd) anAdd.onclick=()=>{ const n=document.getElementById("an-name").value.trim(); if(!n)return;
    p.analyses.push({id:uid(),name:n,status:"received",result:"(добавил пациент)",by:"patient",ts:Date.now()}); upsertPatient(p); renderPatient(); };
  bindAnalysisResult(p, renderPatient);
  document.querySelectorAll('[data-sym]').forEach(b=>b.onchange=()=>{ p.checklist=p.checklist||{};
    if(b.checked) p.checklist[b.getAttribute('data-sym')]=true; else delete p.checklist[b.getAttribute('data-sym')]; upsertPatient(p); });
  const quizGo=document.getElementById('quiz-go');
  if(quizGo) quizGo.onclick=()=>{ const sig=fqSignals({allergies:p.allergies});
    const dx=scoreDifferential(sig); document.getElementById('quiz-result').innerHTML=diffResultHTML(dx,patientCautions(sig),true); document.getElementById('quiz-result').scrollIntoView({behavior:'smooth'}); };
  const idFile=document.getElementById("id-file");
  if(idFile) idFile.onchange=e=>{ const f=e.target.files[0]; const t=(document.getElementById("id-type")||{}).value||"документ";
    readCompressedImage(f,(url)=>{ if(!url){alert("Не удалось обработать фото");return;}
      p.idDoc={dataUrl:url,type:t,ts:Date.now(),status:"pending"}; upsertPatient(p); S.tab="id"; renderPatient(); }); };
  const idRepl=document.getElementById("id-replace");
  if(idRepl) idRepl.onclick=()=>{ p.idDoc=null; upsertPatient(p); renderPatient(); };
  bindRxShare(p);
}

function bindDoctorActions(p){
  bindFQ();
  const re=renderPatientCard;
  const algSave=document.getElementById("alg-save");
  if(algSave) algSave.onclick=()=>{ p.allergies=document.getElementById("alg").value.trim(); upsertPatient(p); re(); };
  const medAdd=document.getElementById("med-add");
  if(medAdd) medAdd.onclick=()=>{ const n=document.getElementById("med-name").value.trim(); if(!n)return;
    p.meds.push({name:n,dose:document.getElementById("med-dose").value.trim()}); upsertPatient(p); re(); };
  document.querySelectorAll("[data-delmed]").forEach(b=>b.onclick=()=>{p.meds.splice(+b.getAttribute("data-delmed"),1);upsertPatient(p);re();});
  const symAdd=document.getElementById("sym-add");
  if(symAdd) symAdd.onclick=()=>{ const t=document.getElementById("sym-text").value.trim(); if(!t)return;
    p.symptoms.push({id:uid(),text:t,by:"doctor",ts:Date.now()}); upsertPatient(p); re(); };
  const anAdd=document.getElementById("an-add");
  if(anAdd) anAdd.onclick=()=>{ const n=document.getElementById("an-name").value.trim(); if(!n)return;
    p.analyses.push({id:uid(),name:n,status:"ordered",result:"",by:"doctor",ts:Date.now()}); upsertPatient(p); re(); };
  bindAnalysisResult(p, re);
  const rxAdd=document.getElementById("rx-add");
  if(rxAdd) rxAdd.onclick=()=>{ const t=document.getElementById("rx-text").value.trim(); if(!t)return;
    p.prescriptions.push({id:uid(),text:t,dose:document.getElementById("rx-dose").value.trim(),by:"doctor",ts:Date.now()}); upsertPatient(p); re(); };
  document.querySelectorAll("[data-delrx]").forEach(b=>b.onclick=()=>{p.prescriptions.splice(+b.getAttribute("data-delrx"),1);upsertPatient(p);re();});
  bindRxShare(p);
  const remAdd=document.getElementById("rem-add");
  if(remAdd) remAdd.onclick=()=>{ const t=document.getElementById("rem-text").value.trim(); if(!t)return;
    const wk=+document.getElementById("rem-wk").value; p.reminders.push({id:uid(),text:t,dueTs:daysFromNow(wk*7),done:false}); upsertPatient(p); re(); };
  document.querySelectorAll("[data-remdone]").forEach(b=>b.onclick=()=>{const i=+b.getAttribute("data-remdone");p.reminders[i].done=!p.reminders[i].done;upsertPatient(p);re();});
  const pasteGo=document.getElementById("paste-go");
  if(pasteGo) pasteGo.onclick=()=>{
    const o=parseAnketaCode(document.getElementById("paste-anketa").value);
    if(!o){ alert(t('pasteFail')); return; }
    document.getElementById("v-complaint").value=o.complaint||"";
    document.getElementById("v-sbp").value=o.sbp||""; document.getElementById("v-dbp").value=o.dbp||"";
    document.getElementById("v-hr").value=o.hr||""; document.getElementById("v-preg").checked=!!o.pregnant;
    document.querySelectorAll('[data-sym]').forEach(b=>{ b.checked=o.symIds.indexOf(b.getAttribute('data-sym'))>=0; });
    if(o.allergies && !p.allergies) p.allergies=o.allergies;
    if(o.meds){ p.meds=p.meds||[]; if(!p.meds.some(m=>m.name.toLowerCase()===String(o.meds).toLowerCase())) p.meds.push({name:o.meds,dose:""}); }
    upsertPatient(p);
    document.getElementById("dx-calc").click();
    const r=document.getElementById("dx-result"); if(r) r.scrollIntoView({behavior:"smooth"});
  };
  const dxCalc=document.getElementById("dx-calc");
  if(dxCalc) dxCalc.onclick=()=>{
    const extra={complaint:document.getElementById("v-complaint").value,
      sbp:document.getElementById("v-sbp").value,dbp:document.getElementById("v-dbp").value,
      hr:document.getElementById("v-hr").value,temp:document.getElementById("v-temp").value,
      pregnant:document.getElementById("v-preg").checked, allergies:p.allergies};
    const sig=fqSignals(extra);
    const dx=scoreDifferential(sig); const pc=patientCautions(sig);
    document.getElementById("dx-result").innerHTML=diffResultHTML(dx,pc,false);
    if(dx.length){ document.getElementById("v-diff").value=dx.slice(0,3).map(d=>d.name+" ("+d.matchPct+"%)").join("; ");
      if(!document.getElementById("v-plan").value.trim()) document.getElementById("v-plan").value="Сегодня: "+dx[0].treatmentToday; }
  };
  const repGo=document.getElementById("report-go");
  if(repGo) repGo.onclick=()=>{
    const extra={complaint:document.getElementById("v-complaint").value,
      sbp:document.getElementById("v-sbp").value,dbp:document.getElementById("v-dbp").value,
      hr:document.getElementById("v-hr").value,temp:document.getElementById("v-temp").value,
      pregnant:document.getElementById("v-preg").checked, allergies:p.allergies};
    const sig=fqSignals(extra);
    const dx=scoreDifferential(sig); const pc=patientCautions(sig);
    extra.fqParts=sig._fq.parts; extra.age=sig.age;
    const rep=visitReportHTML(p,dx,pc,extra);
    document.getElementById("print-area").innerHTML=rep;
    const area=document.getElementById("report-area");
    const repText=buildReportText(p,dx,pc,extra);
    area.innerHTML='<div class="card">'+rep+'<div style="margin-top:10px"><button class="btn-ghost" id="report-print">'+t('printReport')+'</button></div>'+editTranslateHTML()+'</div>'+sendBlockHTML();
    document.getElementById("report-print").onclick=()=>window.print();
    bindEditTranslate(repText);
    bindSend(()=>currentReportText(repText));
    area.scrollIntoView({behavior:"smooth"});
  };
  const vSave=document.getElementById("v-save");
  if(vSave) vSave.onclick=()=>{
    const c=document.getElementById("v-complaint").value.trim();
    const fu=document.getElementById("v-fu").value;
    if(!c){ alert("Укажите жалобы."); return; }
    p.visits.push({id:uid(),ts:Date.now(),complaint:c,differential:document.getElementById("v-diff").value.trim(),
      plan:document.getElementById("v-plan").value.trim(),followUp:fu,by:"doctor"});
    const wk=parseInt(fu.replace(/\D/g,""))||4;
    p.reminders.push({id:uid(),text:"Контроль после визита: "+c.slice(0,40),dueTs:daysFromNow(wk*7),done:false});
    upsertPatient(p); S.tab="timeline"; re();
  };
}

function bindAnalysisResult(p, re){
  document.querySelectorAll("[data-resbtn]").forEach(b=>b.onclick=()=>{
    const id=b.getAttribute("data-resbtn");
    const inp=document.querySelector(`[data-res="${id}"]`);
    const an=p.analyses.find(x=>x.id===id); if(!an)return;
    an.status="received"; an.result=(inp&&inp.value.trim())||"(получен)"; upsertPatient(p); re();
  });
}

render();
</script>
